<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#061b45">
    <title>MediaMVP</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de boas-vindas -->
    <section id="start-screen" aria-label="Tela inicial MediaMVP">
        <header class="welcome-header">
            <div class="brand" aria-label="MediaMVP">
                <svg class="brand-symbol" viewBox="0 0 72 72" aria-hidden="true">
                    <path d="M12 8 L12 64 L52 36 Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round" />
                    <path d="M53 18 Q67 36 53 54 M61 10 Q81 36 61 62" fill="none" stroke="#13baff" stroke-width="5" stroke-linecap="round" />
                </svg>
                <span>Media<span class="brand-accent">MVP</span></span>
            </div>
            <div id="welcome-date" class="welcome-date">Terça-feira, 03 de novembro</div>
        </header>

        <main class="welcome-center">
            <p id="welcome-greeting" class="welcome-greeting">Olá! Seja bem-vindo!</p>
            <time id="welcome-clock" class="welcome-clock" aria-label="Horário atual">08:42</time>
        </main>

        <footer class="welcome-footer">
            <div class="welcome-location">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-7.2 8-13a8 8 0 1 0-16 0c0 5.8 8 13 8 13Zm0-10.5A3.5 3.5 0 1 1 12 4.5a3.5 3.5 0 0 1 0 7Z" fill="currentColor"/></svg>
                <span>ITAPETININGA — SP</span>
            </div>
            <button id="start-button" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8v16.4L20 12 6 3.8Z" fill="currentColor"/></svg>
                <span>Iniciar</span>
            </button>
        </footer>
    </section>

    <main id="player" aria-label="Reprodução de mídia"></main>
    <div id="progress"></div>

    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js").catch((error) => {
                    console.warn("Erro ao registrar Service Worker:", error);
                });
            });
        }
    </script>
</body>
</html>
