<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Media Player</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- =========================
         TELA INICIAL
         ========================= -->

    <div id="start-screen">

        <div class="start-content">

            <div class="start-icon">
                ▶
            </div>

            <h1>
                Media Player
            </h1>

            <p>
                Toque para iniciar
            </p>

            <button id="start-button">
                INICIAR PLAYER
            </button>

            <small>
                O player entrará em tela cheia
                e manterá a tela ligada.
            </small>

        </div>

    </div>


    <!-- =========================
         PLAYER
         ========================= -->

    <main id="player">

        <!-- Os slides serão criados
             automaticamente pelo app.js -->

    </main>


    <!-- =========================
         BARRA DE PROGRESSO
         ========================= -->

    <div id="progress"></div>


    <script src="app.js"></script>


    <!-- =========================
         SERVICE WORKER
         ========================= -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register("./sw.js")
                        .then(() => {

                            console.log(
                                "Service Worker registrado."
                            );

                        })
                        .catch((error) => {

                            console.warn(
                                "Erro ao registrar Service Worker:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>

</html>
